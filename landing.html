<script>
  async function sendToMake(name, phone, topic) {
    const WEBHOOK_URL = 'REPLACE_WITH_YOUR_MAKE_WEBHOOK_URL';
    try {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          phone: phone,
          interest: topic,
          source: 'דף נחיתה'
        })
      });
    } catch (e) {
      console.log('Make webhook error:', e);
    }
  }

  function sendWhatsApp() {
    var name = document.getElementById('clientName').value;
    var phone = document.getElementById('clientPhone').value;
    var topic = document.getElementById('clientTopic').value || 'לא צוין';

    // שולח ל-Make ול-CRM
    sendToMake(name, phone, topic);

    var msg = encodeURIComponent(
      'שלום! פנייה חדשה מדף הנחיתה:\n' +
      'שם: ' + name + '\n' +
      'טלפון: ' + phone + '\n' +
      'נושא: ' + topic
    );
    var waUrl = 'https://wa.me/972522471510?text=' + msg;
    document.getElementById('leadForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
    window.location.href = waUrl;
  }
</script>
